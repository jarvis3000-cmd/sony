<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live TV Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Roboto,system-ui,sans-serif;
}
.shaka-video-container{
  position:absolute;
  inset:0;
}
video{
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}
</style>
</head>

<body>

<div class="shaka-video-container youtube-theme" data-shaka-player>
  <video autoplay playsinline muted></video>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const streamUrl = params.get("url");
const keyId = params.get("keyId");
const key = params.get("key");

if (!streamUrl || !keyId || !key) {
  document.body.innerHTML = "<h2 style='color:white;text-align:center'>Invalid stream parameters</h2>";
  throw new Error("Missing stream params");
}

document.addEventListener("DOMContentLoaded", async () => {
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    alert("Browser not supported");
    return;
  }

  const video = document.querySelector("video");
  const player = new shaka.Player(video);

  const container = document.querySelector(".shaka-video-container");
  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      "play_pause",
      "time_and_duration",
      "mute",
      "volume",
      "spacer",
      "quality",
      "language",
      "picture_in_picture",
      "fullscreen",
      "overflow_menu"
    ],
    enableFullscreenOnRotation: true
  });

  player.configure({
    drm: {
      clearKeys: {
        [keyId]: key
      }
    },
    streaming: {
      lowLatencyMode: true,
      bufferingGoal: 15,
      rebufferingGoal: 2,
      bufferBehind: 15
    }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers["Referer"] = "https://www.jiotv.com/";
    request.headers["User-Agent"] =
      "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
  });

  try {
    await player.load(streamUrl);

    // Autoplay handling
    try {
      video.muted = false;
      await video.play();
    } catch {
      video.muted = true;
      await video.play();
    }

  } catch (e) {
    console.error("Playback error:", e);
  }

  // Mobile fullscreen on first play
  video.addEventListener("play", () => {
    if (window.innerWidth <= 768 && !document.fullscreenElement) {
      container.requestFullscreen().catch(()=>{});
    }
  }, { once:true });
});
</script>

</body>
</html>
